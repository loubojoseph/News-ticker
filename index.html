<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>today's brief</title>
<style>
:root{--ink:#1f3d2b;--soft:#4a6553;--line:#c9d8c6;--accent:#8a6a4a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:transparent}
body{font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden}
.card{height:100%;min-height:200px;display:flex;flex-direction:column;gap:8px;padding:16px 18px 12px;border-radius:14px;background:linear-gradient(135deg,#eef4ec 0%,#dfe9dc 100%);border:1px solid var(--line);position:relative;overflow:hidden}
.slide{flex:1;display:flex;flex-direction:column;gap:8px;transition:opacity .35s ease,transform .35s ease;overflow:hidden}
.slide.out{opacity:0;transform:translateY(6px)}
.h{font-size:clamp(17px,2.6vw,20px);line-height:1.25;font-weight:750;text-wrap:balance;margin:0}
.s{margin:0;color:var(--soft);font-size:14.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.bottom{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--soft)}
.meta{white-space:nowrap}
.meta b{color:var(--ink);font-weight:650}
.dots{flex:1;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--ink)}
.nav{display:flex;gap:6px}
.nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#f7faf6;color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
.nav button:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ink);opacity:.5}
.bar.run{animation:fill var(--t,20s) linear forwards}
.paused .bar.run{animation-play-state:paused}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.bar{display:none}}
@media (max-width:420px){.dots{display:none}.s{-webkit-line-clamp:5}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="slide" id="slide">
    <p class="h" id="h"></p>
    <p class="s" id="s"></p>
  </div>
  <div class="bottom">
    <span class="meta"><b>📰 today's brief</b> · <span id="date"></span> · <span id="count"></span></span>
    <div class="dots" id="dots"></div>
    <div class="nav"><button id="prev" aria-label="Previous story">‹</button><button id="next" aria-label="Next story">›</button></div>
  </div>
  <div class="bar" id="bar"></div>
</div>
<script>
{
  // Stories arrive in the address:
  //   #z=<base64url of raw-deflate(JSON)>   (compressed, preferred)
  //   #d=<base64url of JSON>                (plain)
  // JSON: {"d":"Mon 23 Nov","s":20,"i":[["code","headline","summary"],…]}
  // The first field of each story (a section code) is not shown.
  const $ = id => document.getElementById(id);
  function bytesOf(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bin = atob(s), out = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
    return out;
  }
  async function load() {
    const h = location.hash;
    let m = h.match(/z=([A-Za-z0-9_\-]+)/);
    if (m && "DecompressionStream" in window) {
      const stream = new Blob([bytesOf(m[1])]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return JSON.parse(await new Response(stream).text());
    }
    m = h.match(/d=([A-Za-z0-9_\-]+)/);
    if (m) return JSON.parse(new TextDecoder().decode(bytesOf(m[1])));
    return {d:"", s:20, i:[]};
  }
  function run(data) {
    const items = Array.isArray(data.i) ? data.i : [];
    const secs = Math.max(5, Number(data.s) || 20);
    const card = $("card"), slide = $("slide"), bar = $("bar"), dots = $("dots");
    const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    card.style.setProperty("--t", secs + "s");
    $("date").textContent = data.d || "";
    let i = 0, timer = null, paused = false;
    dots.innerHTML = items.map((_, k) => `<button class="dot" aria-label="Story ${k + 1}" data-k="${k}"></button>`).join("");
    function paint() {
      const it = items[i];
      if (!it) { $("h").textContent = "No stories yet"; $("s").textContent = "The morning brief lands around 6:10. The full brief with links is in the dropdown below.";  $("count").textContent = ""; return; }
      $("h").textContent = it[1] || "";
      $("s").textContent = it[2] || "";
      $("count").textContent = `${i + 1}/${items.length}`;
      [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
      bar.classList.remove("run"); void bar.offsetWidth; if (!paused) bar.classList.add("run");
    }
    function show(n) {
      if (!items.length) return paint();
      const next = (n + items.length) % items.length;
      if (still) { i = next; paint(); return; }
      slide.classList.add("out");
      setTimeout(() => { i = next; paint(); slide.classList.remove("out"); }, 300);
    }
    function start() { clearInterval(timer); if (items.length > 1) timer = setInterval(() => { if (!paused) show(i + 1); }, secs * 1000); }
    function restart(n) { show(n); start(); }
    $("next").addEventListener("click", () => restart(i + 1));
    $("prev").addEventListener("click", () => restart(i - 1));
    dots.addEventListener("click", e => { const k = e.target.dataset && e.target.dataset.k; if (k !== undefined) restart(Number(k)); });
    card.addEventListener("mouseenter", () => { paused = true; card.classList.add("paused"); });
    card.addEventListener("mouseleave", () => { paused = false; card.classList.remove("paused"); });
    document.addEventListener("keydown", e => { if (e.key === "ArrowRight") restart(i + 1); if (e.key === "ArrowLeft") restart(i - 1); });
    let x0 = null;
    card.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive: true});
    card.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) restart(dx < 0 ? i + 1 : i - 1); x0 = null; });
    paint(); start();
  }
  window.addEventListener("hashchange", () => location.reload());
  load().then(run).catch(() => run({d:"", s:20, i:[]}));
}
</script>
</body>
</html>
